<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindLaw | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', "sans-serif"],
                    },
                    colors: {
                        mindlaw: {
                            teal: "#002228",
                            softTeal: "#00333A",
                            gold: "#C5A059",
                            white: "#FFFFFF",
                        },
                    },
                },
            },
        };
    </script>
</head>
<body class="min-h-screen bg-mindlaw-teal font-sans text-mindlaw-white antialiased">
    <main class="min-h-screen w-full flex items-center justify-center p-6">
        <section class="w-full max-w-md rounded-2xl border border-mindlaw-gold/20 bg-mindlaw-softTeal p-8 shadow-2xl shadow-black/20">
            <div class="mb-8 space-y-2 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl border border-mindlaw-gold/40 bg-mindlaw-gold/10">
                    <i data-lucide="scale" class="h-7 w-7 text-mindlaw-gold"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight">MindLaw</h1>
                <p class="text-sm text-mindlaw-white/75">Acesse o painel de inteligência com segurança.</p>
            </div>

            {% if error %}
            <div class="mb-5 rounded-xl border border-red-300/20 bg-red-300/10 px-4 py-3 text-sm text-red-100">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-5">
                <label class="block space-y-2">
                    <span class="text-xs font-semibold uppercase tracking-[0.18em] text-mindlaw-white/80">Usuário</span>
                    <div class="relative">
                        <i data-lucide="user-round" class="pointer-events-none absolute left-3 top-3.5 h-4 w-4 text-mindlaw-gold"></i>
                        <input
                            type="text"
                            name="username"
                            value="{{ username }}"
                            required
                            class="w-full rounded-xl border border-mindlaw-gold/20 bg-mindlaw-teal/50 py-3 pl-10 pr-3 text-sm text-mindlaw-white outline-none transition focus:border-mindlaw-gold focus:ring-2 focus:ring-mindlaw-gold/20"
                            placeholder="Digite seu usuário"
                        />
                    </div>
                </label>

                <label class="block space-y-2">
                    <span class="text-xs font-semibold uppercase tracking-[0.18em] text-mindlaw-white/80">Senha</span>
                    <div class="relative">
                        <i data-lucide="lock-keyhole" class="pointer-events-none absolute left-3 top-3.5 h-4 w-4 text-mindlaw-gold"></i>
                        <input
                            type="password"
                            name="password"
                            required
                            class="w-full rounded-xl border border-mindlaw-gold/20 bg-mindlaw-teal/50 py-3 pl-10 pr-3 text-sm text-mindlaw-white outline-none transition focus:border-mindlaw-gold focus:ring-2 focus:ring-mindlaw-gold/20"
                            placeholder="Digite sua senha"
                        />
                    </div>
                </label>

                <button
                    type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-xl bg-mindlaw-gold px-4 py-3 text-sm font-bold uppercase tracking-[0.14em] text-mindlaw-teal transition hover:brightness-105"
                >
                    <i data-lucide="log-in" class="h-4 w-4"></i>
                    Entrar
                </button>
            </form>
        </section>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
